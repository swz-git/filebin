<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/style.css" />

        <link rel="icon" type="image/x-icon" href="/filebin-ico.svg" />

        <script src="/htmx.min.js"></script>
        <title>filebin</title>
    </head>
    <body>
        <header>
            <div class="logoContainer">
                <h1>filebin</h1>
                <p>file uploading service</p>
            </div>
            <div class="grow"></div>
            <a href="/admin">admin panel</a>
        </header>
        <div class="main">
            <div></div>

            <form
                hx-post="/api/file"
                class="dropZone"
                enctype="multipart/form-data"
                hx-swap="none"
                hx-on::after-request="window.location.reload()"
            >
                <h1>Drop files to upload...</h1>
                <input id="fileInput" type="file" name="file" />
                <button type="submit">Submit</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <td>File</td>
                        <td>Size</td>
                        <td>Mime Type</td>
                        <td>Actions</td>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td class="shrinkText">
                            <a href="/f/{{ file.slug }}">{{ file.name }}</a>
                        </td>
                        <td>{{ file.size }}</td>
                        <td>{{ file.mime }}</td>
                        <td>
                            <button
                                hx-delete="/api/file/{{ file.slug }}"
                                hx-trigger="click"
                                hx-swap="none"
                                hx-on::after-request="window.location.reload()"
                            >
                                Delete
                            </button>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td><p>None...</p></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <footer>
            <p>We use cookies to remember your uploaded items.</p>
        </footer>
    </body>

    <!-- Drag and drop styling -->
    <script>
        // Minimal JS to bind file drop to the hidden input + trigger HTMX form submit
        document.addEventListener("dragover", (e) => {
            e.preventDefault();
            document.body.classList.add("dropHover");
        });

        document.addEventListener("dragleave", (e) => {
            document.body.classList.remove("dropHover");
        });

        document.addEventListener("drop", (e) => {
            e.preventDefault();
            document.body.classList.remove("dropHover");

            const fileInput = document.getElementById("fileInput");
            fileInput.files = e.dataTransfer.files;
            htmx.trigger(".dropZone", "submit");
        });
    </script>
    <style>
        body.dropHover:after {
            display: flex;
            justify-content: center;
            align-items: center;
            content: "Drop file to upload";
            font-size: 4rem;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            z-index: 999;
        }
    </style>
</html>
