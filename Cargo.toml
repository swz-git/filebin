[package]
name = "filebin"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "tokio-macros",
    "net",
] }
axum = { version = "0.8.4", default-features = false, features = [
    "http1",
    "http2",
    "query",
    "tokio",
    "macros",
] }
askama = "0.12"
rust-embed = { version = "8.7.2", features = ["axum"] }
mime_guess = "2.0.5"
ormlite = { version = "0.24.1", features = ["sqlite"] }
base64 = "0.22.1"
sqlx = "0.8.6"
ahash = "0.8.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
rust-argon2 = "3.0.0"
rand = "0.9.2"
color-eyre = "0.6.5"
axum-extra = { version = "0.10.1", features = ["cookie"] }
humansize = "2.1.3"
humantime = "2.2.0"
chrono = "0.4.41"
dotenvy = "0.15.7"
tokio-util = { version = "0.7.16", features = ["io"] }
object_store = { git = "https://github.com/swz-git/arrow-rs-object-store", rev = "ab67b35", features = [
    "aws",
] }
futures = "0.3.31"
futures-util = "0.3.31"
tower-http = { version = "0.6.6", features = [
    "compression-br",
    "compression-gzip",
] }
multer = "3.1.0"
tokio-stream = { version = "0.1.17", features = ["sync"] }
